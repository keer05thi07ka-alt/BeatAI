<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="beatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F45B75" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#42C7E8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge Background -->
  <rect width="100" height="100" rx="24" fill="#0B1F33" />
  
  <!-- Heart Base Shape -->
  <path d="M50 82 C25 64 14 50 14 35 C14 22 24 14 36 14 C43 14 47 18 50 22 C53 18 57 14 64 14 C76 14 86 22 86 35 C86 50 75 64 50 82 Z" fill="url(#beatGradient)" />
  
  <!-- ECG Pulse Waveform Line Running Through Heart -->
  <path d="M16 48 L32 48 L38 36 L44 58 L52 26 L58 54 L64 42 L70 48 L84 48" 
        fill="none" 
        stroke="url(#pulseGradient)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
